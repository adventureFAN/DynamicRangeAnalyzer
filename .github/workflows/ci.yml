name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Install FFmpeg test dependency
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

      - name: Build
        run: dotnet build --configuration Release --no-incremental

      - name: Portable tests
        run: dotnet test .\DRAnalyzer.Tests\DRAnalyzer.Tests.csproj --configuration Release --no-build --filter "Category!=ExternalReference"