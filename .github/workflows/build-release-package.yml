name: Build Windows release package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg-runtime:
    name: Build verified FFmpeg 9.0 LGPL runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MinGW-w64 build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            libz-mingw-w64-dev \
            make \
            nasm \
            xz-utils \
            curl \
            gnupg

      - name: Build FFmpeg runtime
        run: bash ./scripts/build-ffmpeg-runtime.sh

      - name: Upload FFmpeg runtime and source
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-9.0-win-x64-lgpl-runtime
          path: artifacts/ffmpeg-runtime
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Build Dynamic Range Analyzer portable package
    needs: ffmpeg-runtime
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10.0.400
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'

      - name: Download FFmpeg runtime
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-9.0-win-x64-lgpl-runtime
          path: artifacts\ffmpeg-runtime

      - name: Build and package
        shell: powershell
        run: |
          .\scripts\package-windows.ps1 `
            -FfmpegArtifactDir '.\artifacts\ffmpeg-runtime' `
            -OutputDir '.\artifacts\windows-package'

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Dynamic-Range-Analyzer-1.0.0-release-candidate
          path: artifacts\windows-package\release-artifacts
          if-no-files-found: error
          retention-days: 14